[project]
name = "sales-analytics-dashboard"
version = "1.0.0"
description = "Sales Analytics Dashboard - An interactive sales intelligence workspace"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36.0,<=1.49.1",
    "pandas>=2.0.0,<=2.3.2",
    "numpy>=1.24.0,<=2.3.3",
    "plotly>=5.18.0,<=6.3.0",
    "openpyxl>=3.1.2,<=3.1.5",
    "scipy>=1.11.0,<=1.16.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<=8.4.2",
    "ruff>=0.4.0,<=0.16.2",
]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
